<!DOCTYPE html>
<html>
<head>
    <title>Cadena de Frío</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            margin: 100px auto;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        input {
            padding: 10px;
            width: 80%;
            border-radius: 8px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .ok {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🌡️ Cadena de Frío</h2>

    <input type="text" id="producto" placeholder="vacunas / carne">

    <br>

    <button onclick="consultar()">Consultar</button>

    <p id="resultado"></p>
</div>

<script src="script.js"></script>

</body>
</html>
